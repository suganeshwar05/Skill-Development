<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Example</title>

    <style>

        /* Element Selector */
        h1 {
            color: blue;
        }

        /* Class Selector */
        .para {
            color: green;
            font-size: 20px;
        }

        /* ID Selector */
        #special {
            color: red;
            background-color: yellow;
        }

        /* Universal Selector */
        * {
            font-family: Arial;
        }

    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <p class="para">
        This paragraph uses class selector.
    </p>

    <p id="special">
        This paragraph uses ID selector.
    </p>

    <p>
        This is a normal paragraph.
    </p>

</body>
</html>
</body>
</html>
