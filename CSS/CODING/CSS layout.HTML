<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout Example</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: lightgray;
            padding: 15px;
            width: 20%;
            float: left;
            height: 300px;
        }

        section {
            width: 75%;
            float: right;
            padding: 20px;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            clear: both;
        }

    </style>
</head>

<body>

    <header>
        <h1>CSS Layout</h1>
    </header>

    <nav>
        <h3>Menu</h3>
        <p>Home</p>
        <p>About</p>
        <p>Contact</p>
    </nav>

    <section>
        <h2>Welcome</h2>
        <p>
            This is a simple CSS layout example using header, navigation, section, and footer.
        </p>
    </section>

    <footer>
        Footer Section
    </footer>

</body>
</html>
