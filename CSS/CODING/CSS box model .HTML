<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid blue;
            margin: 30px;
            background-color: white;
            text-align: center;
            font-size: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model Example</h1>

    <div class="box">
        This is a box model example.
    </div>

</body>
</html>
