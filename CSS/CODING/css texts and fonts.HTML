<!DOCTYPE html>
<html>
<head>
    <title>CSS Text and Fonts</title>

    <style>

        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: blue;
            text-align: center;
            text-transform: uppercase;
        }

        p {
            font-size: 20px;
            color: darkgreen;
            text-align: justify;
            line-height: 1.8;
        }

        .italic-text {
            font-style: italic;
        }

        .bold-text {
            font-weight: bold;
        }

        .decorated-text {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <h1>CSS Text and Fonts</h1>

    <p>
        This paragraph shows basic text formatting using CSS.
    </p>

    <p class="italic-text">
        This text is italic.
    </p>

    <p class="bold-text">
        This text is bold.
    </p>

    <p class="decorated-text">
        This text is underlined.
    </p>

</body>
</html>
