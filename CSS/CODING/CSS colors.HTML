<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors Example</title>

    <style>

        body {
            background-color: lightgray;
            font-family: Arial;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        .red-text {
            color: red;
        }

        .green-text {
            color: green;
        }

        .yellow-bg {
            background-color: yellow;
        }

        .hex-color {
            color: #ff6600;
        }

        .rgb-color {
            color: rgb(128, 0, 128);
        }

    </style>
</head>

<body>

    <h1>CSS Colors Example</h1>

    <p class="red-text">This text is red.</p>

    <p class="green-text">This text is green.</p>

    <p class="yellow-bg">This paragraph has yellow background.</p>

    <p class="hex-color">This text uses HEX color.</p>

    <p class="rgb-color">This text uses RGB color.</p>

</body>
</html>
