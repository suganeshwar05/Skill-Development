<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>AngularJS Validation Example</title>

    <!-- AngularJS Library -->
    <script src="c:\Users\gnana\Downloads\angular-1.8.2\angular-1.8.2\angular.min.js"></script>
</head>

<body ng-controller="myCtrl">

    <p>Try writing in the input field:</p>

    <form name="myForm">

        <input type="text"
               name="myInput"
               ng-model="myInput"
               required
               my-directive>

    </form>

    <p>The input's valid state is:</p>

    <h1>{{myForm.myInput.$valid}}</h1>

    <p>
        The input field must contain the character "e"
        to be considered valid.
    </p>

    <script>
        // Create AngularJS App
        var app = angular.module("myApp", []);

        // Controller
        app.controller("myCtrl", function($scope) {
        });

        // Custom Directive
        app.directive("myDirective", function () {
            return {
                require: "ngModel",
                link: function (scope, element, attrs, mCtrl) {

                    function myValidation(value) {

                        // Check if input contains letter 'e'
                        if (value.indexOf("e") > -1) {
                            mCtrl.$setValidity("charE", true);
                        } else {
                            mCtrl.$setValidity("charE", false);
                        }

                        return value;
                    }

                    mCtrl.$parsers.push(myValidation);
                }
            };
        });
    </script>

</body>
</html>
