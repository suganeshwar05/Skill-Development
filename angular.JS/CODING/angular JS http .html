<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AngularJS HTTP Service Example</title>

    <!-- AngularJS Library -->
    <script src="c:\Users\gnana\Downloads\angular-1.8.2\angular-1.8.2\angular.min.js"></script>
</head>

<body>

<div ng-app="myApp" ng-controller="myCtrl">

    <p>Today's welcome message is:</p>

    <h1>{{myWelcome}}</h1>

</div>

<p>
    The $http service requests a page on the server,
    and the response is set as the value of the
    "myWelcome" variable.
</p>

<script>
    // Create AngularJS Module
    var app = angular.module('myApp', []);

    // Create Controller
    app.controller('myCtrl', function($scope, $http) {

        // HTTP GET Request
        $http.get("welcome.htm")
        .then(function(response) {

            // Store response data
            $scope.myWelcome = response.data;

        });

    });
</script>

</body>
</html>
